<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- icone favorito -->
    <link rel="shortcut icon" href="imagens/home2.png" type="image/x-icon">
    <title>Fav icons</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif;">
    <div>
         <h1>
        Imagens do google
        </h1>
        <!-- tag para imagens -->
        <img src="imagens/Teste.png" alt="Interistelar" title="Interistelar" align="left" >
    
    </div>
   <div>
    <br>
        <h2>
        Interistelar - com proporção de imagens
        </h2>
        <img
        src="imagens/Teste.jpg" 
        alt="Interistelar"
        width="800px"
        height="600px">
   </div>
   <h2>
    Interistelar com proporção de imagens com style 
   </h2>
   <div>
    <img src="imagens/Teste.png"
     alt="Interistelar"
      title="Interistelar" 
      style="margin: 20px;
       background-image: url(imagens/Teste.jpg);
       background-size: auto;
       background-repeat: repeat-x; width: 50px; height: 30px;">
   </div>
</body>
</html>
